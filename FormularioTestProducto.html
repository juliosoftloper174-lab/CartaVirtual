<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <title>Agregar Producto</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                padding: 20px;
            }
            form {
                max-width: 400px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            input,
            select,
            textarea,
            button {
                padding: 8px;
                font-size: 14px;
            }
            button {
                background-color: #3490dc;
                color: white;
                border: none;
                cursor: pointer;
            }
            button:hover {
                background-color: #2779bd;
            }
            label {
                display: flex;
                align-items: center;
                gap: 5px;
            }
        </style>
    </head>
    <body>
        <h2>Agregar Producto</h2>
        <form id="productoForm">
            <input
                type="text"
                id="nombre"
                placeholder="Nombre del producto"
                required
            />
            <textarea id="descripcion" placeholder="Descripción"></textarea>
            <input
                type="number"
                step="0.01"
                id="precio"
                placeholder="Precio"
                required
            />
            <select id="categoria" required>
                <option value="">Seleccione categoría</option>
            </select>
            <label>
                <input type="checkbox" id="estado" checked />
                Activo
            </label>
            <input type="file" id="imagen" accept="image/*" />
            <button type="submit">Agregar Producto</button>
        </form>

        <script>
            const API_URL = "http://127.0.0.1:8000/api"; // Ajusta según tu configuración

            // Cargar categorías en el select
            async function cargarCategorias() {
                try {
                    const res = await fetch(`${API_URL}/categorias`);
                    const categorias = await res.json();
                    const select = document.getElementById("categoria");
                    categorias.forEach((cat) => {
                        const option = document.createElement("option");
                        option.value = cat.id_categoria;
                        option.textContent = cat.nombre;
                        select.appendChild(option);
                    });
                } catch (err) {
                    console.error("Error cargando categorías:", err);
                }
            }

            cargarCategorias();

            // Manejar envío del formulario
            document
                .getElementById("productoForm")
                .addEventListener("submit", async (e) => {
                    e.preventDefault();

                    const formData = new FormData();
                    formData.append(
                        "nombre",
                        document.getElementById("nombre").value
                    );
                    formData.append(
                        "descripcion",
                        document.getElementById("descripcion").value
                    );
                    formData.append(
                        "precio",
                        document.getElementById("precio").value
                    );
                    formData.append(
                        "id_categoria",
                        document.getElementById("categoria").value
                    );
                    formData.append(
                        "estado",
                        document.getElementById("estado").checked ? 1 : 0
                    );

                    const fileInput = document.getElementById("imagen");
                    if (fileInput.files.length > 0) {
                        formData.append("imagen", fileInput.files[0]);
                    }

                    try {
                        const res = await fetch(`${API_URL}/productos`, {
                            method: "POST",
                            body: formData,
                        });

                        if (!res.ok)
                            throw new Error(`Error HTTP: ${res.status}`);

                        const data = await res.json();
                        alert(
                            "Producto agregado con éxito: " + data.data.nombre
                        );
                        document.getElementById("productoForm").reset();
                    } catch (err) {
                        console.error("Error al agregar producto:", err);
                        alert("Error al agregar producto. Revisa la consola.");
                    }
                });
        </script>
    </body>
</html>
